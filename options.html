<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TokenWatch options</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1d1f23; --muted: #646a73; --border: #e1e4e8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17181b; --card: #212327; --text: #e8eaed; --muted: #9aa0a6; --border: #33363c; } }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    fieldset { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 0 0 14px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; margin: 6px 0; }
    input[type=number] { width: 70px; }
    .hint, #status { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>TokenWatch options</h1>
  <fieldset>
    <legend>Background refresh</legend>
    <label><input type="checkbox" id="background"> Refresh in the background</label>
    <label>Every <input type="number" id="intervalMin" min="5" step="1"> minutes</label>
    <div class="hint">Minimum 5 minutes. Errors and HTTP 429 back off automatically.</div>
  </fieldset>
  <fieldset>
    <legend>Toolbar badge</legend>
    <label><input type="checkbox" id="badge"> Show highest % used on the toolbar icon</label>
  </fieldset>
  <fieldset>
    <legend>Services to show</legend>
    <div id="services"></div>
  </fieldset>
  <div id="status" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
